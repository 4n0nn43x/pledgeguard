# Production on the shared server: behind the common Caddy (~/apps/edge), reached only through the
# "edge" network, never published on the host. Site block: ~/apps/edge/sites/pledgeguard.caddy.
# Secret: .devnet.env next to this file (chmod 600): the keys of scripts/.devnet.env plus DEMO_PASSWORD,
# SESSION_SECRET (32+ random chars) and PACKAGE_PREFERENCE (the pledgeguard package id to pin).
name: pledgeguard

services:
  web:
    build: .
    image: pledgeguard:local
    container_name: pledgeguard-web   # stable name, what Caddy resolves
    restart: unless-stopped
    volumes:
      - ./.devnet.env:/run/secrets/devnet.env:ro
    networks: [edge]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  # The registry automation: opens one index per fingerprint and settles draws, as `ops`. No port at all.
  registry:
    image: pledgeguard:local
    container_name: pledgeguard-registry
    command: ["node", "backend/registry.mjs"]
    restart: unless-stopped
    env_file: .devnet.env
    environment:
      LEDGER_URL: https://ledger-api-json.participant.hackcanton-01.devnet.naas.noders.services
      TOKEN_REGISTRY_URL: https://scan.sv-1.dev.global.canton.network.digitalasset.com
      STATE_FILE: /data/registry-state.json
    volumes:
      - registry-state:/data
    depends_on: [web]                 # web builds the image
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 128m
    pids_limit: 64
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

networks:
  edge:
    name: edge
    external: true

volumes:
  registry-state:
